<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Mol* MD contacts</title>
        <style>
            html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f1; }
            #layout { display: grid; grid-template-columns: minmax(0, 1fr) 6px minmax(340px, var(--panel, 46%)); height: 100%; }
            #viewer { position: relative; min-width: 0; }
            #splitter { cursor: col-resize; background: #dddcd6; }
            #splitter:hover { background: #2a78d6; }
            #panel { min-width: 0; min-height: 0; overflow: hidden; }
            @media (max-width: 700px) {
                html, body { overflow: auto; }
                #layout { grid-template-columns: 1fr; grid-template-rows: 55vh 0 auto; height: auto; }
                #panel { overflow: visible; }
            }
        </style>
        <link rel="stylesheet" type="text/css" href="index.css" />
    </head>
    <body>
        <div id="layout">
            <div id="viewer"></div>
            <div id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize panel"></div>
            <div id="panel"></div>
        </div>
        <script type="text/javascript" src="./index.js"></script>
    </body>
</html>
